<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portal AR – McCORMICK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, 'Roboto', sans-serif;
      color: #fff;
    }

    /* ── Video de cámara (fondo) ─────────────────────────── */
    #camera-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* ── Canvas Three.js (encima del video, transparente) ── */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
    }

    /* ── Pantalla de inicio ──────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      cursor: pointer;
      overflow: hidden;
      background: #000;
    }

    #splash-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Indicador de tap animado */
    #splash-tap {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      text-align: center;
      animation: pulse-up 2s ease-in-out infinite;
      pointer-events: none;
    }

    #splash-tap p {
      display: inline-block;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 28px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    @keyframes pulse-up {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50%       { opacity: 1;   transform: translateY(-8px); }
    }

    /* Spinner que aparece AL INICIO DE LA CARGA (se superpone al splash) */
    #splash-loading {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.7);
    }

    #splash-loading.on {
      display: flex;
    }

    #status-text {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.05em;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Botón de reintento (solo en error) */
    #btn-open {
      display: none;
      padding: 14px 40px;
      background: rgba(255, 80, 80, 0.25);
      border: 2px solid rgba(255, 80, 80, 0.6);
      border-radius: 50px;
      color: #ffaaaa;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    #error-msg {
      display: none;
      background: rgba(255, 60, 60, 0.12);
      border: 1px solid rgba(255, 80, 80, 0.35);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 0.85rem;
      color: #ffaaaa;
      max-width: 340px;
      white-space: pre-wrap;
      line-height: 1.5;
      text-align: left;
      margin: 0 20px;
    }

    /* ── HUD de instrucciones ────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 22px 20px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
      display: none;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    /* ── Botón de colocar portal ─────────────────────────── */
    #btn-place {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 16px 40px;
      background: rgba(139, 0, 0, 0.35);
      border: 2px solid rgba(255, 80, 80, 0.7);
      border-radius: 50px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
      letter-spacing: 0.08em;
    }

    #btn-place:active {
      background: rgba(139, 0, 0, 0.6);
    }

    /* ── Tarjeta de producto (aparece al entrar al portal) ── */


    #product-card .company-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #C8A84B;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: -4px;
    }

    #product-card .product-title {
      font-size: 1.25rem;
      font-weight: 900;
      text-align: center;
      color: #fff;
      line-height: 1.1;
    }

    #product-card .cta-btn {
      width: 100%;
      padding: 13px 10px;
      background: linear-gradient(135deg, #C8A84B, #e8c86a);
      border: none;
      border-radius: 12px;
      color: #1a1100;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(200,168,75,0.35);
    }

    #product-card .cta-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(200,168,75,0.2);
    }
  </style>
  <script type="module" crossorigin src="/assets/index-D7tSIJx1.js"></script>
</head>

<body>

  <!-- Fondo: video de la cámara real -->
  <video id="camera-bg" autoplay playsinline muted></video>

  <!-- Pantalla de inicio: Start.jpg a pantalla completa -->
  <div id="splash">
    <img id="splash-img" src="/models/Start.jpg" alt="McCORMICK AR Experience" />

    <!-- Indicador animado de tap -->
    <div id="splash-tap">
      <p>✦ Toca para comenzar ✦</p>
    </div>

    <!-- Capa de carga (se muestra al hacer tap) -->
    <div id="splash-loading">
      <div class="spinner"></div>
      <p id="status-text">Iniciando experiencia...</p>
      <div id="error-msg"></div>
      <button id="btn-open">Reintentar</button>
    </div>
  </div>

  <!-- Instrucciones en pantalla durante AR -->
  <div id="hud">Mueve el teléfono y toca para colocar el portal</div>

  <!-- Botón flotante para colocar portal -->
  <button id="btn-place">📍 Colocar portal aquí</button>

  <!-- El CTA ya no está en HTML, es un objeto 3D -->

</body>

</html>
