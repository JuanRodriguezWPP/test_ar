<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portal WebAR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, 'Roboto', sans-serif;
      background: #000;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }

    /* Pantalla de inicio */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 24px;
      padding: 40px;
      text-align: center;
    }

    #splash h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00ff88, #00cc66);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #splash p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      max-width: 320px;
      line-height: 1.5;
    }

    #splash-status {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      min-height: 24px;
    }

    /* Spinner */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .spinner.active {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Botón principal */
    #btn-start {
      padding: 18px 48px;
      background: linear-gradient(135deg, #00704A, #00ff88);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      box-shadow: 0 8px 32px rgba(0, 255, 136, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #btn-start:active {
      transform: scale(0.96);
      box-shadow: 0 4px 16px rgba(0, 255, 136, 0.2);
    }

    /* Error */
    #error-box {
      display: none;
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 0.85rem;
      color: #ff9999;
      max-width: 340px;
      text-align: left;
      line-height: 1.5;
    }

    /* HUD en AR */
    #hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
      z-index: 50;
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla de inicio -->
  <div id="splash">
    <h1>Portal test 24</h1>
    <p id="splash-status">Verificando compatibilidad...</p>
    <div class="spinner" id="spinner"></div>
    <button id="btn-start">Abrir Cámara AR</button>
    <div id="error-box"></div>
  </div>

  <!-- HUD en modo AR -->
  <div id="hud">Apunta al piso para colocar el portal</div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
